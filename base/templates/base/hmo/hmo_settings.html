{% extends 'settings.html' %} {% load i18n %} {% block settings %} {% load static %}
<div class="oh-inner-sidebar-content">
    <div class="oh-inner-sidebar-content__header d-flex justify-content-between align-items-center">
        <h2 class="oh-inner-sidebar-content__title">{% trans "HMO" %}</h2>
        <button class="oh-btn oh-btn--secondary oh-btn--shadow" data-toggle="oh-modal-toggle"
            data-target="#objectCreateModal" hx-get="{% url 'hmo-settings-create' %}"
            hx-target="#objectCreateModalTarget">
            <ion-icon name="add-outline" class="me-1"></ion-icon>
            {% trans "Create" %}
        </button>
    </div>
    {% if hmos %}
        {% include 'base/hmo/hmo_settings_list.html' %}
    {% else %}
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
            <h5 class="oh-404__subtitle">{% trans "No HMO yet" %}</h5>
        </div>
    {% endif %}
</div>
{% endblock settings %}
