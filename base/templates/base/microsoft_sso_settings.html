{% extends 'settings.html' %} {% load i18n %} {% block settings %}
<div class="oh-inner-sidebar-content">
    <div class="oh-inner-sidebar-content__header mt-3">
        <h2 class="oh-inner-sidebar-content__title">{% trans "Microsoft SSO" %}</h2>
    </div>
    <div class="oh-inner-sidebar-content__body">
        <!-- Microsoft SSO settings will be added here -->
        <form method="post" action="{% url 'microsoft_auth_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="client_id">Client ID</label>
                <input type="text" class="form-control" id="client_id" name="client_id" value="{{ settings.MICROSOFT_AUTH_CLIENT_ID }}" placeholder="Enter Client ID">
            </div>
            <div class="form-group">
                <label for="client_secret">Client Secret</label>
                <input type="password" class="form-control" id="client_secret" name="client_secret" value="{{ settings.MICROSOFT_AUTH_CLIENT_SECRET }}" placeholder="Enter Client Secret">
            </div>
            <div class="form-group">
                <label for="tenant_id">Tenant ID</label>
                <input type="text" class="form-control" id="tenant_id" name="tenant_id" value="{{ settings.MICROSOFT_AUTH_TENANT_ID }}" placeholder="Enter Tenant ID">
            </div>
            <button type="submit" class="btn btn-primary">Login with Microsoft</button>
        </form>
        <p class="mt-3">Current settings: Client ID: {{ settings.MICROSOFT_AUTH_CLIENT_ID }}, Tenant ID: {{ settings.MICROSOFT_AUTH_TENANT_ID }}</p>
        <button id="sync-users-btn" class="btn btn-secondary mt-3">Sync Users</button>
        <div id="sync-result" class="mt-3"></div>
        <script>
            document.getElementById('sync-users-btn').addEventListener('click', function() {
                fetch('{% url "microsoft-sync-users" %}', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById('sync-result');
                    if (data.error) {
                        resultDiv.innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
                    } else {
                        const users = data.users || [];
                        resultDiv.innerHTML = '<div class="alert alert-success">Fetched ' + users.length + ' users.</div>';
                    }
                })
                .catch(err => {
                    document.getElementById('sync-result').innerHTML = '<div class="alert alert-danger">Fetch error.</div>';
                });
            });
        </script>
    </div>
</div>
{% endblock settings %}
