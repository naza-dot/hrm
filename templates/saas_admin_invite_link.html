{% load i18n %}
<div class="oh-modal__dialog-header pb-0">
    <h2 class="oh-modal__dialog-title">{% trans "Invite Link Generated" %}</h2>
    <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    <p>{% trans "Share this link with the company admin to set up their account:" %}</p>
    <div class="oh-input-group mb-3">
        <input type="text" class="oh-input" id="inviteLinkInput" value="{{ invite_url }}" readonly
            style="background: #f8f9fa; cursor: text;">
    </div>
    <div class="d-flex gap-2">
        <button class="oh-btn oh-btn--secondary oh-btn--shadow" onclick="copyInviteLink()">
            {% trans "Copy Link" %}
        </button>
        <button class="oh-btn oh-btn--info oh-btn--shadow" onclick="window.open('{{ invite_url }}', '_blank')">
            {% trans "Open Link" %}
        </button>
    </div>
    <hr class="mt-4 mb-3">
    <div class="row">
        <div class="col-sm-6">
            <p><strong>{% trans "Company:" %}</strong> {{ company.company }}</p>
        </div>
        <div class="col-sm-6">
            <p><strong>{% trans "Expires:" %}</strong> {{ invite.expires_at }}</p>
        </div>
    </div>
</div>
<script>
    function copyInviteLink() {
        const input = document.getElementById('inviteLinkInput');
        input.select();
        input.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(input.value).then(() => {
            const btn = document.querySelector('.oh-btn--secondary');
            const original = btn.innerHTML;
            btn.innerHTML = '{% trans "Copied!" %}';
            setTimeout(() => { btn.innerHTML = original; }, 2000);
        });
    }
</script>
